[project]
name = "mmtrust"
version = "0.1.0"
description = "Multi-model trust orchestration: detect agreement/disagreement, attach citations, validate structured output."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["pydantic>=2.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"